name: APK Derle

# Kod her güncellendiğinde (ya da Actions sekmesinden elle) APK derlenir
# ve "Releases" bölümüne indirilebilir dosya olarak konur. Telefondaki
# uygulama yeni sürümü buradan görüp kendini günceller.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # İmza anahtarının şifresi: Settings → Secrets and variables → Actions
  YONETIM_KEYSTORE_PASSWORD: ${{ secrets.YONETIM_KEYSTORE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Sürüm numarası
        run: echo "SURUM=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Paketler
        run: flutter pub get

      - name: Analiz
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testler
        run: flutter test

      - name: Android proje dosyalarını oluştur
        run: flutter create --platforms=android --org com.panagro --project-name yonetim_raporu .

      - name: Android ayarları (uygulama adı, izinler, imza anahtarı)
        run: |
          if [ -z "$YONETIM_KEYSTORE_PASSWORD" ]; then
            echo "::error::İmza şifresi eksik. GitHub → Settings → Secrets and variables → Actions bölümüne YONETIM_KEYSTORE_PASSWORD ekleyin."
            exit 1
          fi
          python3 ci/android_ayarla.py .

      - name: APK derle
        run: |
          flutter build apk --release --build-number=$SURUM --dart-define=BUILD_NUMBER=$SURUM
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/yonetim-raporu.apk

      - name: İmza kontrolü (güncellemeler eskisinin üzerine kurulabilsin)
        run: python3 ci/imza_kontrol.py build/app/outputs/flutter-apk/yonetim-raporu.apk ci/yonetim-raporu.p12

      - name: APK'yı yayınla
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: surum-${{ env.SURUM }}
          name: Yönetim Raporu - Sürüm ${{ env.SURUM }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            Telefona ilk kez kurmak için aşağıdaki yonetim-raporu.apk dosyasına dokunun. Uygulama kuruluysa güncelleme uygulamanın içinden gelir.
          files: build/app/outputs/flutter-apk/yonetim-raporu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
