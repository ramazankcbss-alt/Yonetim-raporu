name: Web Sürümü (şirket paneli)

# Paylaşım panelinin kullandığı web sürümü: uygulama web için derlenir ve GitHub Pages'e konur.
# Yalnızca program kodu yayınlanır; veri içermez. Veri şirket panelinde (Apps Script, şirket hesabıyla
# giriş zorunlu) paylaşım anahtarıyla gelir; tarayıcıda saklanmaz.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Flutter kur
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Web derle
        run: |
          flutter pub get
          flutter create --platforms=web --org com.panagro --project-name yonetim_raporu .
          flutter build web --release --base-href /Yonetim-raporu/ --no-web-resources-cdn
          sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow">#' build/web/index.html
          sed -i 's#<title>[^<]*</title>#<title>Tarım ve Hayvancılık</title>#' build/web/index.html
          printf 'User-agent: *\nDisallow: /\n' > build/web/robots.txt
          ls -la build/web


      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
