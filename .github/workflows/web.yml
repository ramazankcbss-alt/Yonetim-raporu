name: Web Sürümü (şirket paneli)

# Paylaşım panelinin kullandığı web sürümü: uygulama web için derlenir ve "web-yayin" dalına konur.
# Şirket paneli (Apps Script) bu dosyaları jsDelivr üzerinden yükler. Yalnızca program kodu yayınlanır;
# veri içermez. Veri şirket hesabıyla girişten sonra paylaşım anahtarıyla gelir; tarayıcıda saklanmaz.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-yayin
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Flutter kur
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Web derle
        run: |
          flutter pub get
          flutter create --platforms=web --org com.panagro --project-name yonetim_raporu .
          flutter build web --release
          sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow">#' build/web/index.html
          sed -i 's#<title>[^<]*</title>#<title>Tarım ve Hayvancılık</title>#' build/web/index.html
          printf 'User-agent: *\nDisallow: /\n' > build/web/robots.txt
          du -sh build/web

      - name: web-yayin dalına koy
        run: |
          cd build/web
          # Sürüm adı: panel sayfası en son sürümü bu dosyadan öğrenir ve değişmez etiketten yükler
          echo "w${GITHUB_RUN_NUMBER}" > surum.txt
          git init -q -b web-yayin
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Web sürümü ${GITHUB_SHA::7} (yalnızca program kodu, veri içermez)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" web-yayin
          git tag "w${GITHUB_RUN_NUMBER}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "w${GITHUB_RUN_NUMBER}"
