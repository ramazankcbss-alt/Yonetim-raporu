name: Web sürümü

# Paylaşım linkleri uygulamanın web sürümünü açar (kurulum gerekmez):
# https://ramazankcbss-alt.github.io/Yonetim-raporu/?s=<veri adresi>&k=<paylaşım anahtarı>
# Sayfada veri bulunmaz; veriler yalnızca paylaşım anahtarıyla ve yalnızca paylaşılan bölümler için gelir.
# Derlenen dosyalar gh-pages dalına konur (Settings → Pages → Branch: gh-pages / root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Flutter kur
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Web proje dosyalarını oluştur
        run: flutter create --platforms=web --org com.panagro --project-name yonetim_raporu .

      - name: Derle
        run: |
          flutter pub get
          flutter build web --release --base-href /Yonetim-raporu/ --no-web-resources-cdn --pwa-strategy=none
          # Arama motorları dizinlemesin
          printf 'User-agent: *\nDisallow: /\n' > build/web/robots.txt
          sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">#' build/web/index.html
          touch build/web/.nojekyll

      - name: gh-pages dalına yayımla
        run: |
          cd build/web
          git init -q -b gh-pages
          git config user.name "ramazankcbss-alt"
          git config user.email "ramazankcbss-alt@users.noreply.github.com"
          git add -A
          git commit -qm "Web sürümü ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
