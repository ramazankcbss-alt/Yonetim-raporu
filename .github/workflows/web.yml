name: Web sürümü

# Uygulamanın bilgisayarda tarayıcıdan açılan sürümü GitHub Pages'e yayımlanır:
# https://ramazankcbss-alt.github.io/Yonetim-raporu/
# Sayfada veri bulunmaz; veriler kullanıcının girdiği Apps Script bağlantısıyla gelir.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Flutter kur
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Web proje dosyalarını oluştur
        run: flutter create --platforms=web --org com.panagro --project-name yonetim_raporu .

      - name: Derle
        run: |
          flutter pub get
          flutter build web --release --base-href /Yonetim-raporu/ --no-web-resources-cdn
          # Arama motorları dizinlemesin
          printf 'User-agent: *\nDisallow: /\n' > build/web/robots.txt
          sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
