name: yonetim_raporu
description: "Çiftlikler yönetim raporu: günlük ve haftalık pano, üst yöneticiye PDF rapor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  shared_preferences: ^2.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  ota_update: ^7.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
