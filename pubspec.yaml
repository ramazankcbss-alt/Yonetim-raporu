name: yonetim_raporu
description: "Çiftlikler yönetim raporu: günlük ve haftalık pano, üst yöneticiye PDF rapor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  shared_preferences: ^2.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  ota_update: ^7.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/veri/hastalik.json
    - assets/veri/ciftlik_rapor_2026.json
    - assets/veri/maliyet_takip_2026.json
    - assets/veri/tarla_2025_2026.json
    - assets/veri/tarla_2023_2024.json
    - assets/veri/tarla_2024_2025.json
    - assets/veri/tarla_2026_2027.json
